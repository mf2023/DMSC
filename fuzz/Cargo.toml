# Fuzzing workspace for the Ri project.
#
# This is a separate Cargo workspace generated by `cargo fuzz init` style
# layout. It is intentionally NOT a member of the main workspace to keep the
# fuzz-only dependencies (libfuzzer-sys, arbitrary) out of the main build.
#
# To run a fuzz target locally:
#   cargo +nightly fuzz run protocol_frame_parse
# To run a short (smoke) test in CI:
#   cargo +nightly fuzz run protocol_frame_parse -- -max_total_time=60

[package]
name = "ri-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
# Fuzz engine bindings (libFuzzer on Linux/macOS, custom stub elsewhere)
libfuzzer-sys = "0.4"
# Structured fuzz input generation (for arbitrary-derived types)
arbitrary = { version = "1", features = ["derive"] }

# The crate under test. Enable every feature that has parser/decrypt/verify
# surface so the fuzz targets can reach the code paths an attacker would.
[dependencies.ri]
path = ".."
features = [
    "grpc",
    "websocket",
    "rabbitmq",
    "cache",
    "queue",
    "gateway",
    "auth",
    "observability",
    "protocol",
    "sqlite",
    "postgres",
    "mysql",
    "service_mesh",
    "http_client",
    "system_info",
    "config_hot_reload",
    "etcd",
    "kafka",
]

# Isolate the fuzz workspace from the main one.
[workspace]
